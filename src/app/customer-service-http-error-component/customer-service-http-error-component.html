<p>customer-service-http-error-component works!</p>

<div *ngIf="errMessage" class="error-msg">
  {{ errMessage }}
</div>

<table class="customer-table">
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>#</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let type of customerTypes">
      <tr class="group-header">
        <td colspan="5">
          {{ type.CustomerTypeId }} - {{ type.CustomterTypeName }}
        </td>
      </tr>

      <tr *ngFor="let cus of type.Customers">
        <td>{{ cus.Id }}</td>
        <td>{{ cus.Name }}</td>
        <td>{{ cus.Email }}</td>
        <td>{{ cus.Age }}</td>
        <td class="img-cell">
          <img [src]="cus.Image" [alt]="cus.Name" class="cus-img">
        </td>
      </tr>
    </ng-container>
  </tbody>
</table>
