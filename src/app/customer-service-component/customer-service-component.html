<p>customer-service-component works!</p>
<table class="customer-table">
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>#</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let type of customerTypes">
      <tr class="type-header-row">
        <td colspan="5">{{ type.CustomerTypeId }} - {{ type.CustomterTypeName }}</td>
      </tr>

      <tr *ngFor="let cus of type.Customers">
        <td>{{ cus.Id }}</td>
        <td>{{ cus.Name }}</td>
        <td>{{ cus.Email }}</td>
        <td>{{ cus.Age }}</td>
        <td>
          <img [src]="cus.Image" [alt]="cus.Name" class="cus-avatar">
        </td>
      </tr>
    </ng-container>
  </tbody>
</table>
